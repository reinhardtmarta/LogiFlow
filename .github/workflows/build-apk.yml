name: Build LogiFlow Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Restore Gradle wrapper scripts
        run: |
          set -euo pipefail
          if [ ! -x android/gradlew ]; then
            curl --fail --silent --show-error --location \
              https://raw.githubusercontent.com/gradle/gradle/master/gradlew \
              --output android/gradlew
            chmod +x android/gradlew
          fi

      - name: Verify Android embedding v2
        run: |
          set -euo pipefail
          main_activity='android/app/src/main/kotlin/com/logiflow/MainActivity.kt'
          manifest='android/app/src/main/AndroidManifest.xml'

          test -f "$main_activity"
          test -f "$manifest"
          grep -q 'import io.flutter.embedding.android.FlutterActivity' "$main_activity"
          grep -Eq 'class[[:space:]]+MainActivity[[:space:]]*:[[:space:]]*FlutterActivity' "$main_activity"

          if grep -q 'flutterEmbedding.*1' "$manifest"; then
            echo '::error::Android v1 embedding encontrado no AndroidManifest.xml.'
            exit 1
          fi

      - name: Configure Firebase for Android
        env:
          FIREBASE_GOOGLE_SERVICES_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_GOOGLE_SERVICES_B64:-}" ]; then
            echo '::error::O segredo FIREBASE_GOOGLE_SERVICES_B64 não está configurado no repositório.'
            echo '::error::Cadastre o conteúdo Base64 de android/app/google-services.json em Settings > Secrets and variables > Actions.'
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_B64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json
          jq empty android/app/google-services.json
          chmod 600 android/app/google-services.json

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Build release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo '::error::O segredo GEMINI_API_KEY não está configurado no repositório.'
            exit 1
          fi

          flutter build apk --release --no-pub \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Prepare APK artifact
        run: |
          set -euo pipefail
          test -f build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "LogiFlow-v${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogiFlow-Android-APK
          path: LogiFlow-v${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 90
