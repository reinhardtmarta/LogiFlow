name: Build LogiFlow Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Clean project and Gradle cache
        run: |
          flutter clean
          rm -rf android/.gradle android/app/build build

      - name: Configure Android v2 embedding
        run: |
          mkdir -p android/app/src/main/kotlin/com/logiflow
          cat > android/app/src/main/kotlin/com/logiflow/MainActivity.kt << 'EOF'
          package com.logiflow

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF
          sed -i '/flutterEmbedding.*1/d' android/app/src/main/AndroidManifest.xml || true

      - name: Configure Firebase for Android
        env:
          FIREBASE_GOOGLE_SERVICES_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_B64 }}
        run: |
          if [ -z "$FIREBASE_GOOGLE_SERVICES_B64" ]; then
            echo "::error::O segredo FIREBASE_GOOGLE_SERVICES_B64 não está configurado no repositório."
            exit 1
          fi
          echo "$FIREBASE_GOOGLE_SERVICES_B64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json
          chmod 600 android/app/google-services.json

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk LogiFlow-v${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogiFlow-Android-APK
          path: LogiFlow-v${{ github.run_number }}.apk
          retention-days: 90
