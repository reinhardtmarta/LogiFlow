name: LogiFlow CI - Security & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            echo "::warning::package-lock.json não encontrado. Recomendado versionar o lockfile para reprodutibilidade."
            npm install --ignore-scripts
          fi

      - name: Dependency Security Audit
        run: |
          echo "Auditando vulnerabilidades críticas em dependências..."
          npm audit --audit-level=high

      - name: TypeScript Static Typecheck
        run: npm exec -- tsc --noEmit

      - name: Build Production Assets (Vite)
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -d dist
          test -f dist/index.html
          echo "Build verificado com sucesso: dist/index.html gerado."

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: logiflow-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
