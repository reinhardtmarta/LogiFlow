plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = new File(rootProject.projectDir, 'local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def flutterEngineVersion = new File(
    localProperties.getProperty('flutter.sdk'),
    'bin/cache/engine.stamp'
).text.trim()

android {
    namespace "com.logiflow"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.logiflow"
        minSdkVersion = flutter.minSdkVersion // Recomendado para Firebase e APIs modernas
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

// The Firebase config is supplied locally and is intentionally not committed.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

dependencies {
    def flutterEmbedding = "1.0.0-${flutterEngineVersion}"
    debugImplementation "io.flutter:flutter_embedding_debug:${flutterEmbedding}"
    profileImplementation "io.flutter:flutter_embedding_profile:${flutterEmbedding}"
    releaseImplementation "io.flutter:flutter_embedding_release:${flutterEmbedding}"
}
