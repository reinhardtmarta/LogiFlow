name: logiflow
description: "LogiFlow - AI-Driven Food Rescue Marketplace"

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

flutter:
  uses-material-design: true

  assets:
    - assets/images/

dependencies:
  flutter:
    sdk: flutter

  # Utils
  shared_preferences: ^2.3.0
  intl: ^0.19.0
  uuid: ^4.5.0

  # Media
  image_picker: ^1.1.2

  # AI
  google_generative_ai: ^0.4.7
  http: ^1.2.0

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
