name: logiflow
description: "LogiFlow - AI-Driven Food Rescue Marketplace"
version: 2.0.0

environment:
  sdk: '>=3.6.0 <4.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  generate: true

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  shared_preferences: ^2.3.0
  intl: ^0.20.2
  uuid: ^4.5.0

  # Media
  image_picker: ^1.1.2

  # AI (Google Generative AI - Gemini/Gemma)
  google_generative_ai: ^0.4.7
  
  
  # Firebase 
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_gen: ^5.4.0
  build_runner: ^2.4.0
  intl_utils: ^2.8.5
